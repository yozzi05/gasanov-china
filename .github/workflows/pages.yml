# Публикует на GitHub Pages:
#   - сам сайт из основной ветки          -> https://<аккаунт>.github.io/<репозиторий>/
#   - предпросмотр каждой ветки fix/<имя> -> .../<репозиторий>/preview/<имя>/
# Запускается при обновлении основной ветки или любой ветки fix/..., при удалении
# ветки fix/... (её предпросмотр исчезает) и раз в день - ради свежего курса юаня.
# Всё опубликованное здесь закрыто от поисковиков (демо-копия).
name: GitHub Pages

on:
  push:
    branches: [master, "fix/**"]
  delete:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # при удалении реагируем только на ветки fix/...
    if: github.event_name != 'delete' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'fix/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Собрать сайт и предпросмотры веток
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/build-pages.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
